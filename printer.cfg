#####################################################################
#	Resonanse compensation configuration
#####################################################################

[adxl345]
cs_pin: EBB:gpio1
spi_software_sclk_pin: EBB:gpio2
spi_software_mosi_pin: EBB:gpio0
spi_software_miso_pin: EBB:gpio3
axes_map: z,-y,x

[resonance_tester]
accel_chip: adxl345
probe_points:
    175, 175, 20  # an example


