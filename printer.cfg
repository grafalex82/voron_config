#####################################################################
#	  General klipper configuration
#####################################################################

[virtual_sdcard]
path: /home/grafalex/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[skew_correction]

[exclude_object]

[idle_timeout]
timeout: 7200
# TODO: handle the timeout case

[pause_resume]

[display_status]

[respond]

[save_variables]
filename: ~/printer_data/config/saved_variables.cfg


#####################################################################
#	  Includes
#####################################################################

# Hardware components
[include hardware/X-Y.cfg]
[include hardware/fans.cfg]
[include hardware/extruder.cfg]
[include hardware/board_pins.cfg]

# Macro
[include homing.cfg]
[include stealthburner_leds.cfg]


#####################################################################
#	  General printer hardware configuration
#####################################################################
[mcu]
serial: /dev/ttyAMA0
baud: 250000
restart_method: command

[mcu EBB]
canbus_uuid: 4145afee711c

# [mcu scanner]
# canbus_uuid: 93bdab480153

[printer]
kinematics:corexy
max_velocity: 1000
max_accel: 10000
max_z_velocity: 25
max_z_accel: 100
square_corner_velocity: 5.0



[stepper_z]
step_pin: PD14
dir_pin: !PD13
enable_pin: !PD15
rotation_distance: 40
full_steps_per_rotation: 200
gear_ratio: 80:16
microsteps: 32
#endstop_pin:probe:z_virtual_endstop
endstop_pin: ^PA0
position_endstop: -0.5
position_max: 350
position_min: -5 
homing_speed: 8
second_homing_speed: 3
