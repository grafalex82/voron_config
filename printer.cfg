#####################################################################
#	  General klipper configuration
#####################################################################

[virtual_sdcard]
path: /home/grafalex/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[skew_correction]

[exclude_object]

[idle_timeout]
timeout: 7200
# TODO: handle the timeout case

[pause_resume]

[display_status]

[respond]

[save_variables]
filename: ~/printer_data/config/saved_variables.cfg


#####################################################################
#	  Includes
#####################################################################

# Hardware components
[include hardware/board_pins.cfg]
[include hardware/X-Y.cfg]
[include hardware/Z.cfg]
[include hardware/fans.cfg]
[include hardware/extruder.cfg]
[include hardware/adxl.cfg]
[include hardware/heater_bed.cfg]
[include hardware/cartographer.cfg]


# Macro
[include macro/homing.cfg]
[include macro/stealthburner_leds.cfg]
[include macro/start_end.cfg]

#####################################################################
#	  General printer hardware configuration
#####################################################################
[mcu]
serial: /dev/ttyAMA0
baud: 250000
restart_method: command

[mcu EBB]
canbus_uuid: 4145afee711c

[mcu cartographer]
canbus_uuid: 93bdab480153

[printer]
kinematics:corexy
max_velocity: 1000
max_accel: 5700
max_z_velocity: 25
max_z_accel: 100
square_corner_velocity: 5.0

[force_move]
enable_force_move: True



