[include hardware/board_pins.cfg]
[include stealthburner_leds.cfg]

#####################################################################
#	  General klipper configuration
#####################################################################

[virtual_sdcard]
path: /home/grafalex/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[skew_correction]

[exclude_object]

[idle_timeout]
timeout: 7200
# TODO: handle the timeout case

[pause_resume]

[display_status]

[respond]

[save_variables]
filename: ~/printer_data/config/saved_variables.cfg


#####################################################################
#	  Includes
#####################################################################
[include homing.cfg]

#####################################################################
#	  General printer hardware configuration
#####################################################################
[mcu]
serial: /dev/ttyAMA0
baud: 250000
restart_method: command

[mcu EBB]
canbus_uuid: 4145afee711c

# [mcu scanner]
# canbus_uuid: 93bdab480153

[printer]
kinematics:corexy
max_velocity: 1000
max_accel: 10000
max_z_velocity: 25
max_z_accel: 100
square_corner_velocity: 5.0


[include hardware/X-Y.cfg]

[stepper_z]
step_pin: PD14
dir_pin: !PD13
enable_pin: !PD15
rotation_distance: 40
full_steps_per_rotation: 200
gear_ratio: 80:16
microsteps: 32
#endstop_pin:probe:z_virtual_endstop
endstop_pin: ^PA0
position_endstop: -0.5
position_max: 350
position_min: -5 
homing_speed: 8
second_homing_speed: 3
# TBD


#####################################################################
#	Bed geometry configuration
#####################################################################

# TBD


#####################################################################
# Fans and GPIO outputs
#####################################################################

[fan]
pin: EBB:gpio13

[heater_fan hotend_fan]
pin: EBB:gpio14
heater: extruder
heater_temp: 50.0

[include hardware/case_fans.cfg]

#####################################################################
#   Extruder
#####################################################################

#TBD

[tmc2208 extruder]
uart_pin: EBB:gpio20
interpolate: false
run_current: 0.650
hold_current: 0.2
stealthchop_threshold: 999999

[extruder]
step_pin: EBB:gpio18
dir_pin: !EBB:gpio19
enable_pin: !EBB:gpio17
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBB:gpio7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: EBB:gpio27
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 300




