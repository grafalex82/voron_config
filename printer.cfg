#####################################################################
#	  General klipper configuration
#####################################################################

[virtual_sdcard]
path: /home/mks/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[skew_correction]

[exclude_object]

[idle_timeout]
timeout: 7200
# TODO: handle the timeout case

[pause_resume]

[display_status]

[respond]



#####################################################################
#	  General printer hardware configuration
#####################################################################
[mcu]
serial: /dev/ttyAMA0
baud: 250000
restart_method: command

[mcu EBB]
canbus_uuid: 4145afee711c

[printer]
kinematics:corexy
max_velocity: 1000
max_accel: 10000
max_z_velocity: 25
max_z_accel: 100
square_corner_velocity: 5.0


