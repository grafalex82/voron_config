[include stealthburner_leds.cfg]

#####################################################################
#	  General klipper configuration
#####################################################################

[virtual_sdcard]
path: /home/grafalex/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[skew_correction]

[exclude_object]

[idle_timeout]
timeout: 7200
# TODO: handle the timeout case

[pause_resume]

[display_status]

[respond]

[save_variables]
filename: ~/printer_data/config/saved_variables.cfg


#####################################################################
#	  Includes
#####################################################################
[include homing.cfg]

#####################################################################
#	  General printer hardware configuration
#####################################################################
[mcu]
serial: /dev/ttyAMA0
baud: 250000
restart_method: command

[mcu EBB]
canbus_uuid: 4145afee711c

# [mcu scanner]
# canbus_uuid: 93bdab480153

[printer]
kinematics:corexy
max_velocity: 1000
max_accel: 10000
max_z_velocity: 25
max_z_accel: 100
square_corner_velocity: 5.0


#####################################################################
#	  Motors configuration
#####################################################################

[force_move]
enable_force_move: true

[stepper_x]
step_pin: PE11
dir_pin: PE10
enable_pin: !PE9
microsteps: 128
rotation_distance: 40
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin:tmc2209_stepper_x:virtual_endstop
position_min: 0  
position_endstop: 350
position_max: 350
homing_speed:100
homing_retract_dist:0
step_pulse_duration:0.0000001
gear_ratio: 1.001:1


[tmc2209 stepper_x]
uart_pin: PE7
run_current: 1.3    # 1.5
hold_current: 0.5
sense_resistor: 0.1102
stealthchop_threshold: 0
diag_pin: PB14 
driver_SGTHRS: 100
interpolate: false


[stepper_y]
step_pin: PD8
dir_pin: PB12
enable_pin: !PD9
microsteps: 128
rotation_distance: 40
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin:tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop:350
position_max:350
homing_speed:100
homing_retract_dist:0
step_pulse_duration:0.0000001
gear_ratio: 1.001:1


[tmc2209 stepper_y]
uart_pin: PE15
run_current: 1.3 # 1.5
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: PB13
driver_SGTHRS: 120
interpolate: false


[stepper_z]
step_pin: PD14
dir_pin: !PD13
enable_pin: !PD15
rotation_distance: 40
full_steps_per_rotation: 200
gear_ratio: 80:16
microsteps: 32
#endstop_pin:probe:z_virtual_endstop
endstop_pin: ^PA0
position_endstop: -0.5
position_max: 350
position_min: -5 
homing_speed: 8
second_homing_speed: 3
# TBD


#####################################################################
#	Bed geometry configuration
#####################################################################

# TBD


#####################################################################
# Fans and GPIO outputs
#####################################################################

[fan]
pin: EBB:gpio13

[heater_fan hotend_fan]
pin: EBB:gpio14
heater: extruder
heater_temp: 50.0

##	Controller and PSU fans
[fan_generic PSU_fan]
pin: PB2

[fan_generic controller_fan]
pin: PA14


#####################################################################
#   Extruder
#####################################################################

#TBD

[tmc2208 extruder]
uart_pin: EBB:gpio20
interpolate: false
run_current: 0.650
hold_current: 0.2
stealthchop_threshold: 999999

[extruder]
step_pin: EBB:gpio18
dir_pin: !EBB:gpio19
enable_pin: !EBB:gpio17
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBB:gpio7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: EBB:gpio27
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 300




