## Z0 Stepper - Front Left
[stepper_z]
step_pin: ZFL_STEP
dir_pin: ZFL_DIR
enable_pin: !ZFL_ENABLE
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop
#endstop_pin: ^PA0
#position_endstop: -0.5
position_min: -5
position_max: 340
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: ZFL_TMCUART
interpolate: false
run_current: 0.7
hold_current: 0.4
sense_resistor: 0.110
stealthchop_threshold: 999999

