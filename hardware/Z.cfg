[quad_gantry_level]
gantry_corners:
	-60,-10
	410,420
points:
	50,25
	50,275
	300,275
	300,25
speed: 400
horizontal_move_z: 7
retries: 5
retry_tolerance: 0.0075
max_adjust: 10
