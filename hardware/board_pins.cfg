[board_pins spider_2_2]
aliases:

	# steppers
	X_STEP=PE11 ,  X_DIR=PE10 ,  X_ENABLE=PE9  ,  X_TMCUART=PE7  , X_DIAG=PB14,
	Y_STEP=PD8  ,  Y_DIR=PB12 ,  Y_ENABLE=PD9  ,  Y_TMCUART=PE15 , Y_DIAG=PB13,

    ZFL_STEP=PE2,  ZFL_DIR=PE4,  ZFL_ENABLE=PE3,  ZFL_TMCUART=PC15,	# Z motor, Front Left,	Connected to E2-mot socket 
    ZFR_STEP=PE6,  ZFR_DIR=PC13, ZFR_ENABLE=PE5,  ZFR_TMCUART=PC14, # Z motor, Front right, Connected to E1-Mot socket
    ZBL_STEP=PD5,  ZBL_DIR=PD6,  ZBL_ENABLE=PD4,  ZBL_TMCUART=PD7,	# Z motor, Back Left,	Connected to E0-mot socket	 
    ZBR_STEP=PD14, ZBR_DIR=PD13, ZBR_ENABLE=PD15, ZBR_TMCUART=PD10, # Z motor, Back right,  Connected to Z-Mot socket

	# Heaters
	BED_HEATER=PB3, # Intentionally connected to E2 output in order to avoid connecting BED_IN power 

	# Thermistors
	BED_TEMP=PB0,

	# fans
	PSU_FAN=PB2,
	CONTROLLER_FAN=PA14


[board_pins EBB_SB2209_CAN]
mcu: EBB
aliases:
	# Extruder motor
	E_STEP=gpio18,
	E_DIR=gpio19,
	E_ENABLE=gpio17,
	E_TMCUART=gpio20,

	# Extruder
	E_HEATER=gpio7,
	E_TEMP_SENSOR=gpio27,

	# Fans
	PART_FAN=gpio13,
	HOTEND_FAN=gpio14

	# LEDs