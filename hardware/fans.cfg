## Toolhead fans

[fan]
pin: EBB:PART_FAN

[heater_fan hotend_fan]
pin: EBB:HOTEND_FAN
heater: extruder
heater_temp: 50.0


##	Controller and PSU fans
[fan_generic PSU_fan]
pin: PSU_FAN

[fan_generic controller_fan]
pin: CONTROLLER_FAN



[gcode_macro MAINBOARD_FAN_ON]
gcode:
    SET_FAN_SPEED FAN=controller_fan SPEED=0.45  ; Enable CPU/MCU fans


[gcode_macro MAINBOARD_FAN_OFF]
gcode:
    SET_FAN_SPEED FAN=controller_fan SPEED=0  ; Enable CPU/MCU fans

[delayed_gcode MAINBOARD_FAN_DELAYED_OFF]
gcode:
    MAINBOARD_FAN_OFF  ; Schedule disabling CPU/MCU fans
