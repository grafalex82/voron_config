[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 27
verbose: yes

# [safe_z_home]
# z_hop: 10
# z_hop_speed: 15
# home_xy_position: 175, 175

[bed_mesh]
zero_reference_position: 175, 175 # The center of the bed. 
speed: 300
horizontal_move_z: 3
mesh_min: 30, 30     # The first probed coordinate, nearest to the origin. This coordinate is relative to the probe's location.
mesh_max: 320, 320  # The probed coordinate farthest from the origin. This is not necessarily the last point probed, as the probing process occurs in a zig-zag fashion. As with mesh_min, this coordinate is relative to the probe's location.
probe_count: 20, 20
adaptive_margin: 10
mesh_pps: 0,0 # Disable interpolation - mesh is probably dense enough