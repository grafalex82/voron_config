#####################################################################
#	  A/B Motors configuration
#####################################################################

[stepper_x]
step_pin: X_STEP
dir_pin: X_DIR
enable_pin: !X_ENABLE
microsteps: 128
rotation_distance: 40
full_steps_per_rotation:200
endstop_pin:tmc2209_stepper_x:virtual_endstop
position_min: 0  
position_endstop: 350
position_max: 350
homing_speed:120
homing_retract_dist:0
step_pulse_duration:0.0000001
gear_ratio: 1.001:1


[tmc2209 stepper_x]
uart_pin: X_TMCUART
run_current: 1.3    # 1.5
hold_current: 0.5
sense_resistor: 0.1102
stealthchop_threshold: 0
diag_pin: X_DIAG
driver_SGTHRS: 100
interpolate: false


[stepper_y]
step_pin: Y_STEP
dir_pin: Y_DIR
enable_pin: !Y_ENABLE
microsteps: 128
rotation_distance: 40
full_steps_per_rotation:200
endstop_pin:tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop:350
position_max:350
homing_speed:120
homing_retract_dist:0
step_pulse_duration:0.0000001
gear_ratio: 1.001:1


[tmc2209 stepper_y]
uart_pin: Y_TMCUART
run_current: 1.3 # 1.5
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: Y_DIAG
driver_SGTHRS: 120
interpolate: false
