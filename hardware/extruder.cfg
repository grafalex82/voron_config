[extruder]
step_pin: EBB:E_STEP
dir_pin: !EBB:E_DIR
enable_pin: !EBB:E_ENABLE
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBB:E_HEATER
sensor_type: EPCOS 100K B57560G104F
sensor_pin: EBB:E_TEMP_SENSOR
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 300

[tmc2208 extruder]
uart_pin: EBB:E_TMCUART
interpolate: false
run_current: 0.650
hold_current: 0.2
stealthchop_threshold: 999999

