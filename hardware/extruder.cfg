[extruder]
step_pin: EBB:E_STEP
dir_pin: EBB:E_DIR
enable_pin: !EBB:E_ENABLE
microsteps: 16
rotation_distance: 22.63978
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBB:E_HEATER
sensor_type: Generic 3950    #EPCOS 100K B57560G104F for E3D V6
sensor_pin: EBB:E_TEMP_SENSOR
min_temp: 0
max_temp: 300
max_extrude_only_distance:100
pressure_advance: 0.04
pressure_advance_smooth_time: 0.04

# Tunable parameters
# control: pid
# pid_kp: 18.629
# pid_ki: 1.071
# pid_kd: 81.036

[tmc2208 extruder]
uart_pin: EBB:E_TMCUART
interpolate: false
run_current: 0.5
hold_current: 0.2
stealthchop_threshold: 0

