[delayed_gcode printer_startup]
gcode:
    CASELIGHT_ON

    BED_MESH_PROFILE LOAD="default"
initial_duration: 1


[gcode_macro PRINT_START]
description: Inserted by slicer at start of print. 
    Usage: PRINT_START BED=<temp> EXTRUDER=<temp>
gcode:
    # Fetch slicer arguments, such as bed, extruder, and chamber temps
    {% set target_bed = params.BED|int %}
    {% set target_extruder = params.EXTRUDER|int %}
    #{% set target_chamber = params.CHAMBER|default("45")|int %}
    #{% set target_chamber_minimal = params.CHAMBER_MINIMAL|default("0")|int %}
    #{% set target_chamber_wait = [target_chamber, target_chamber_minimal]|select(">", 0)|min|default(0) %}
    {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

    # Reset previously configured states
    CLEAR_PAUSE     ; Clear any lingering pause states
    M107            ; Turn off the part fan
    G21             ; set units to millimeters
    G90             ; use absolute coordinates
    M83             ; use relative distances for extrusion

    # Turn on moinboard fan to avoid drivers overheat
    MAINBOARD_FAN_ON

    # Enable heaters, but heat extruder only to 150C to make proper Z calibration
    STATUS_LED_HEATING
    M104 S150                   ; set extruder temp
    M140 S{target_bed}          ; set bed temp
    M109 S150                   ; wait for extruder temp
    M190 S{target_bed}          ; wait for bed temp

    # Home the printer, set absolute positioning and update the Stealthburner LEDs.
    STATUS_LED_HOMING           ; Set LEDs to homing-mode
    G28                         ; Full home (XYZ)
    G90                         ; Absolute position

    # Level the gantry
    STATUS_LED_CALIBRATING_Z    ; Set LEDs to leveling-mode
    CARTOGRAPHER_TOUCH_HOME     ; Detect real Z0
    G0 Z10 F1500                ; Move a bit away from the surface

    # Heat the hotend to the target temperature
    STATUS_LED_HEATING
    M104 S{target_extruder}     ; set extruder temp
    M109 S{target_extruder}     ; wait for extruder temp

    ; Purge the extruder
    STATUS_LED_CLEANING
    G0 Z2.0 F600;
    G0 X50 Y10 F12000;

    G92 E0.0                ; reset extruder distance position
    G0 Z0.4 F600;
    G1 X100.0 E10 F3000.0   ; intro line
    G92 E0.0                ; reset extruder distance position
    G1 X200.0 E15 F3000.0   ; intro line
    G92 E0.0                ; reset extruder distance position
    G0 Z0.8 F600;
    G1 X100.0 E15 F3000.0   ; intro line

    ; Wipe
    G1 Z0.4 F600
    G0 Y12 F6000
    G1 X100 F6000
    G0 Y8 F12000
    G1 X200 F6000
    G1 X190 Y12 F6000
    G1 X180 Y8 F6000
    G1 X170 Y12 F6000
    G1 X160 Y8 F6000
    G1 X150 Y12 F6000

    G92 E0.0                ; reset extruder distance position

    #SKEW_PROFILE LOAD=CaliFlower    ; Enable skew correction

    STATUS_LED_PRINTING

[gcode_macro PRINT_END]
description: Inserted by slicer at the end of print. 
gcode:
    #SET_SKEW CLEAR=1

    M104 S0         ; turn off temperature
    M140 S0         ; turn off heatbed

    G92 E0.0        ; reset extruder distance position
    G1 E-1 F2100    ; retract

    G28 X Y         ; home X and Y axis
    M84             ; disable motors

    M107            ; turn off fan

    UPDATE_DELAYED_GCODE ID=MAINBOARD_FAN_DELAYED_OFF DURATION=30

    STATUS_LED_READY